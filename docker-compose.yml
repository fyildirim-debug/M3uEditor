services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-m3u_playlist_editor}
      POSTGRES_USER: ${DB_USER:-m3u_editor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: ${DB_MEM_LIMIT:-1g}
    pids_limit: 256

  api:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-m3u_playlist_editor}
      DB_USER: ${DB_USER:-m3u_editor}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}
      APP_URL: ${APP_URL:?APP_URL must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Onunde kac proxy varsa o kadar. Yanlis deger hiz limitinin istemci
      # IP'sini yanlis belirlemesine yol acar.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-1536}"
      UPLOAD_DIR: /app/data/logos
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ALLOW_PRIVATE_NETWORK_URLS: ${ALLOW_PRIVATE_NETWORK_URLS:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TV_LOGOS_CDN_BASE: ${TV_LOGOS_CDN_BASE:-}
      AI_MAX_MESSAGE_CHARS: ${AI_MAX_MESSAGE_CHARS:-1000000}
      AI_INLINE_MESSAGE_CHARS: ${AI_INLINE_MESSAGE_CHARS:-12000}
      AI_ATTACHMENT_MAX_BYTES: ${AI_ATTACHMENT_MAX_BYTES:-20971520}
      AI_ATTACHMENT_QUOTA_BYTES: ${AI_ATTACHMENT_QUOTA_BYTES:-209715200}
      AI_MIN_TASK_INTERVAL_MINUTES: ${AI_MIN_TASK_INTERVAL_MINUTES:-15}
      MAX_JSON_BODY: ${MAX_JSON_BODY:-25mb}
      MAX_M3U_BYTES: ${MAX_M3U_BYTES:-20971520}
      MAX_EPG_BYTES: ${MAX_EPG_BYTES:-104857600}
      MAX_XTREAM_BYTES: ${MAX_XTREAM_BYTES:-268435456}
      MAX_CONCURRENT_IMPORTS: ${MAX_CONCURRENT_IMPORTS:-4}
      IMPORT_JOB_TTL_MS: ${IMPORT_JOB_TTL_MS:-600000}
      XTREAM_TOTAL_TIMEOUT_MS: ${XTREAM_TOTAL_TIMEOUT_MS:-120000}
      XTREAM_CATEGORY_CONCURRENCY: ${XTREAM_CATEGORY_CONCURRENCY:-8}
      XTREAM_TYPE_CONCURRENCY: ${XTREAM_TYPE_CONCURRENCY:-2}
      XTREAM_PLAYER_RATE_LIMIT: ${XTREAM_PLAYER_RATE_LIMIT:-20000}
      XTREAM_FAILURE_RATE_LIMIT: ${XTREAM_FAILURE_RATE_LIMIT:-200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    expose:
      - "3000"
    volumes:
      - uploads:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Imports buffer large provider responses. Without a ceiling a single hostile
    # or oversized source can take the host down instead of only the request.
    # Keep this above NODE_MAX_OLD_SPACE_MB, which caps the V8 heap but not
    # external Buffers.
    mem_limit: ${API_MEM_LIMIT:-2g}
    pids_limit: 512
    command: ["sh", "-c", "./node_modules/.bin/knex migrate:latest && node src/index.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # This publishes plain HTTP. Terminate TLS in front of it and bind this port
    # to loopback or a private network — see "TLS is required and is not
    # included" in the README.
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    pids_limit: 128

volumes:
  pgdata:
  uploads:
