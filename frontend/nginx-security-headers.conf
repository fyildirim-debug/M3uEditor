# Ortak guvenlik basliklari. nginx `add_header` miras kurali geregi bir location
# kendi add_header'ini tanimlarsa server seviyesindekiler duser; bu yuzden bu
# dosya hem server seviyesinde hem de add_header kullanan her location'da
# include edilir.
#
# CSP: uygulama yalnizca kendi kokenine istek atar (axios baseURL /api, fetch
# /api ve /health) -> connect-src 'self'. Kanal logolari kullanicinin girdigi
# herhangi bir http(s) adresinden ve logo kutuphanesi CDN'inden gelir ->
# img-src http: https: bilincli olarak genis.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Tarayicilar HSTS'i yalnizca HTTPS uzerinden gelen yanitta dikkate alir; duz
# HTTP kurulumda etkisizdir. includeSubDomains ve preload bilincli olarak yok:
# biri ayni alan adinin HTTP'de kalan alt alanlarini kirar, digeri alan adini
# tarayici listelerine kalici olarak baglar.
add_header Strict-Transport-Security "max-age=15552000" always;
