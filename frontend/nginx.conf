server {
    listen 80;
    server_tokens off;

    # Docker'in gomulu DNS'i. Bu satir olmadan nginx `api` adini YALNIZCA
    # acilista bir kez cozer ve sonsuza dek onbellekte tutar; api konteyneri
    # yeniden yaratilip IP'si degistiginde (her kismi deploy'da olur) tum
    # /api istekleri "connection refused" ile 502 doner ve yalnizca frontend
    # elle yeniden baslatilinca duzelir. Asagidaki proxy_pass'ler adresi
    # degiskenden okuyor, boylece cozumleme istek aninda ve TTL'e uyarak yapilir.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_host api;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;
    include /etc/nginx/snippets/security-headers.conf;

    # Paylasim adresleri sifreyi sorgu dizesinde tasiyabilir (player'lar ozel
    # baslik gonderemez); bu yolda erisim gunlugu kapali.
    location /api/shared/ {
        access_log off;
        proxy_pass http://$api_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location /api/ {
        proxy_pass http://$api_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location /logos/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://$api_host:3000$request_uri;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        proxy_pass http://$api_host:3000$request_uri;
    }

    # Xtream Codes clients require the catalogue paths at the server root.
    # Access logs are disabled here because credentials travel in the query.
    location ~ ^/(player_api\.php|xmltv\.php|get\.php|m3u\.php)$ {
        access_log off;
        proxy_pass http://$api_host:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # Yayin yollari kaldirildi. Acikca reddedilmezlerse asagidaki SPA yakalayicisi
    # devreye girer ve /live/... istegi 200 + index.html doner; oynatici bunu
    # bozuk bir yayin sanip beklemede kalir. 404 net cevaptir.
    location ~ ^/(live|movie|series)/ {
        access_log off;
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
