appId: com.arnexlab.m3ueditor
productName: M3U Editor
copyright: Copyright © 2026 Furkan YILDIRIM

directories:
  output: dist
  buildResources: build

files:
  - main/**
  - server/**
  - renderer/**
  - build/icon.png
  - package.json
  - "!**/*.map"
  - "!**/{test,tests,__tests__,docs,example,examples}/**"
  - "!**/*.{md,markdown,ts,d.ts}"

# Gomulu PostgreSQL ikilileri calistirilabilir olmali; asar icinden calistirilamaz.
asarUnpack:
  - node_modules/@embedded-postgres/**

# Yerel (native) modul yok: pg, bcryptjs saf JavaScript.
npmRebuild: false

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: M3U-Editor-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: M3U Editor
  # Kaldirirken kullanici verisi (oynatma listeleri, veritabani) silinmez.
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: AudioVideo
  icon: build/icon.png
  synopsis: IPTV oynatma listesi düzenleyici
  description: >-
    M3U ve Xtream kaynaklarını düzenleyin, EPG eşleştirin, temiz M3U ve XMLTV
    üretin. Veriler bu bilgisayarda saklanır; sunucu kurulumu gerekmez.
  maintainer: Furkan YILDIRIM
  vendor: Furkan YILDIRIM
  artifactName: M3U-Editor-${version}-${arch}.${ext}
  # Pencere, .desktop kaydiyla ayni kimligi tasisin (gorev cubugu ikonu ve gruplama).
  syncDesktopName: true

# libfuse2 kurulu olmayan dagitimlarda da (Ubuntu 22.04+, Fedora) acilsin diye
# statik AppImage calisma zamani.
toolsets:
  appimage: "1.0.3"

publish:
  provider: github
  owner: fyildirim-debug
  repo: M3uEditor
  releaseType: draft
